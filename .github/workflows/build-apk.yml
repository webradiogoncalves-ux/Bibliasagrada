name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Android e TTS
        run: |
          npm install @capacitor/android@^7.4.3
          npm install @capacitor-community/text-to-speech@^6.1.0

      - name: Baixar Bíblia
        run: |
          curl -L --fail --retry 5 \
            -o public/bible.json \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/pt/almeida-livre/almeida-livre.json

      - name: Corrigir códigos dos livros da Bíblia
        run: |
          python3 - <<'PY'
          import json

          path = 'public/bible.json'

          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          osis_to_abbr = {
              'Gen':'GEN',
              'Exod':'EXO',
              'Lev':'LEV',
              'Num':'NUM',
              'Deut':'DEU',
              'Josh':'JOS',
              'Judg':'JDG',
              'Ruth':'RUT',
              '1Sam':'1SA',
              '2Sam':'2SA',
              '1Kgs':'1KI',
              '2Kgs':'2KI',
              '1Chr':'1CH',
              '2Chr':'2CH',
              'Ezra':'EZR',
              'Neh':'NEH',
              'Esth':'ESTH',
              'Job':'JOB',
              'Ps':'PSA',
              'Prov':'PRO',
              'Eccl':'ECC',
              'Song':'SNG',
              'Isa':'ISA',
              'Jer':'JER',
              'Lam':'LAM',
              'Ezek':'EZK',
              'Dan':'DAN',
              'Hos':'HOS',
              'Joel':'JOL',
              'Amos':'AMO',
              'Obad':'OBA',
              'Jonah':'JON',
              'Mic':'MIC',
              'Nah':'NAM',
              'Hab':'HAB',
              'Zeph':'ZEP',
              'Hag':'HAG',
              'Zech':'ZEC',
              'Mal':'MAL',
              'Matt':'MAT',
              'Mark':'MRK',
              'Luke':'LUK',
              'John':'JHN',
              'Acts':'ACT',
              'Rom':'ROM',
              '1Cor':'1CO',
              '2Cor':'2CO',
              'Gal':'GAL',
              'Eph':'EPH',
              'Phil':'PHP',
              'Col':'COL',
              '1Thess':'1TH',
              '2Thess':'2TH',
              '1Tim':'1TI',
              '2Tim':'2TI',
              'Titus':'TIT',
              'Phlm':'PHM',
              'Heb':'HEB',
              'Jas':'JAS',
              '1Pet':'1PE',
              '2Pet':'2PE',
              '1John':'1JN',
              '2John':'2JN',
              '3John':'3JN',
              'Jude':'JUD',
              'Rev':'REV'
          }

          books = data.get('books', data)

          for book in books:
              osis = book.get('book') or book.get('osis')

              if osis in osis_to_abbr:
                  book['abbreviation'] = osis_to_abbr[osis]
                  book['abbr'] = osis_to_abbr[osis]

              for chapter in book.get('chapters', []):
                  for verse in chapter.get('verses', []):
                      if 'number' in verse and 'verse' not in verse:
                          verse['verse'] = verse['number']

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  separators=(',', ':')
              )

          print('Banco bíblico normalizado com sucesso.')
          PY

      - name: Verificar Bíblia
        run: |
          test -s public/bible.json
          echo "Bíblia encontrada e normalizada:"
          wc -c public/bible.json

      - name: Criar versão web
        run: npm run build

      - name: Criar Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Sagrada-Devocional-Lite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
